name: Build Intention Mobile V2.3.1 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          flutter create --platforms=android --org uz.intention --project-name intention_mobile .
          python3 - <<'PY'
          from pathlib import Path
          for f in [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]:
              if not f.exists():
                  continue
              s=f.read_text()
              s=s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
              s=s.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 23')
              f.write_text(s)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          permission = '<uses-permission android:name=\"android.permission.INTERNET\" />'
          if permission not in m:
              m = m.replace('<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">',
                            '<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    ' + permission)
              manifest.write_text(m)
          PY

      - name: Resolve packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --dart-define="APP_NAME=Intention School V2.3.1"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Intention_Mobile_V2.3.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Intention-Mobile-V2.3.1-APK
          path: Intention_Mobile_V2.3.1.apk
